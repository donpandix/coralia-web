version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:cached
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Coralia
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coralia
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    command: >
      sh -c "
      if [ ! -f .env ]; then cp .env.example .env; fi && 
      composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-ansi && 
      npm install --no-fund --no-audit && 
      npm run build && 
      mkdir -p storage/logs bootstrap/cache &&
      chown -R www-data:www-data storage bootstrap/cache &&
      chmod -R ug+rwX storage bootstrap/cache &&
      php artisan key:generate --force && 
      php artisan storage:link &&
      php artisan migrate --force && 
      chown -R www-data:www-data storage bootstrap/cache &&
      chmod -R ug+rwX storage bootstrap/cache &&
      apache2-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null && test -f /var/www/html/artisan"]
      interval: 20s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: coralia
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: laravel-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  app_vendor:
  app_storage:
  app_cache:
